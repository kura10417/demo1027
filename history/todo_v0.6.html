.focus-panel{margin-bottom:18px;background:linear-gradient(125deg,#fffaf0 0%,#fff 55%,#f1edff 100%);border:2px solid #d9c9ff;box-shadow:0 14px 34px #6558d31b}

.focus-title{font-size:23px;font-weight:800;margin:0 0 6px;color:#4337a3}.focus-hint{color:#6e6885;font-size:13px;margin:0}
.focus-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.focus-controls label{font-size:13px;color:#5b5577}.focus-controls select{padding:8px 10px;border-color:#cfc4ff}

.focus-card.is-done{opacity:.7}.focus-card.is-done .focus-task-title{text-decoration:line-through}
.focus-card-head{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px}

.focus-add{background:#eeeaff;color:#5944b9}.focus-add.active{background:#e2f6ed;color:#247454}
.task[draggable="true"]{cursor:grab}.task.dragging{opacity:.45}.task:focus-visible{outline:3px solid #6558d3;outline-offset:2px}

.app-controls{position:relative;margin-bottom:12px}.menu-button{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--card);border:1px solid var(--border);color:var(--text);box-shadow:0 6px 18px #252b4d0b}.menu-icon{font-size:18px;line-height:1}.settings-menu{position:absolute;z-index:10;top:calc(100% + 8px);left:0;width:min(340px,calc(100vw - 32px));padding:17px;background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 16px 42px #252b4d28}.settings-menu[hidden]{display:none}.settings-menu h2{font-size:16px;margin:0 0 5px}.settings-menu p{font-size:13px;color:var(--muted);margin:0 0 14px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--border);font-size:14px}.setting-row select{padding:8px 10px}.mode-options{display:flex;gap:6px}.mode-option{padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--muted);font-size:13px}.mode-option.active{background:var(--pale);border-color:#d7d1ff;color:var(--primary)}.switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}.switch input{position:absolute;opacity:0}.switch-track{width:42px;height:24px;border-radius:99px;background:#c9cdd8;transition:background .2s}.switch-track::after{content:"";display:block;width:18px;height:18px;margin:3px;border-radius:50%;background:#fff;transition:transform .2s}.switch input:checked + .switch-track{background:var(--primary)}.switch input:checked + .switch-track::after{transform:translateX(18px)}body.focus-mode .stats,body.focus-mode .task-panel,body.focus-mode .footer{display:none}body.focus-mode .header{margin-bottom:18px}body.focus-mode .subtitle::after{content:" 目前僅顯示今天的聚焦事項。"}.focus-banner{display:none;margin:-6px 0 16px;padding:10px 13px;border-radius:11px;background:var(--pale);color:var(--primary);font-size:13px;font-weight:650}body.focus-mode .focus-banner{display:block}body.dark-mode{--bg:#171a25;--card:#242938;--text:#f1f2f7;--muted:#b2b8c9;--primary:#aea4ff;--pale:#353250;--border:#41485c;--red:#ff9eaa;--redbg:#572d39;--yellow:#ffda78;--yellowbg:#5d4b1d;--green:#82e0ba;--greenbg:#1e5040;background:radial-gradient(circle at top left,#302b58 0,transparent 34%),var(--bg)}body.dark-mode input,body.dark-mode select{background:#1d2230;color:var(--text)}body.dark-mode .focus-panel{background:linear-gradient(125deg,#342c22 0%,var(--card) 55%,#312c4e 100%);border-color:#7569b8}body.dark-mode .focus-title{color:#c5beff}body.dark-mode .focus-hint,body.dark-mode .focus-empty{color:#c0b9d5}body.dark-mode .focus-zone{border-color:#7569b8}body.dark-mode .focus-card{background:#282d3d;border-color:#615990}body.dark-mode .focus-remove,body.dark-mode .focus-add{background:#3c365f;color:#d0caff}body.dark-mode .task,body.dark-mode .date-pill,body.dark-mode .icon-btn{background:#242938;color:var(--text)}body.dark-mode .tag,body.dark-mode .status{background:#343a4b;color:var(--text)}body.dark-mode .delete{background:#4b2a35;color:#ffb5be}
/* v0.6 緊湊雙欄工作區 */
body{padding:16px}.header{display:grid;grid-template-columns:max-content max-content minmax(430px,1fr);align-items:center;gap:14px;margin-bottom:14px}.header h1{margin:0;white-space:nowrap}.header .version{margin:0;white-space:nowrap}.top-add-form{display:grid;grid-template-columns:minmax(150px,1fr) 142px 106px auto;gap:8px}.top-add-form input,.top-add-form select{padding:10px}.top-add-form .add-btn{padding:0 14px;min-height:41px}.stats{display:none}.workspace-grid{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(460px,1.18fr);gap:16px;align-items:start}.workspace-grid .panel{margin:0}.focus-list{grid-template-columns:1fr}.focus-zone{min-height:0}.focus-empty{padding:18px 10px}.focus-card{padding:12px}.task-panel{min-width:0}.toolbar{margin:0 0 12px}.footer{margin-top:12px}body.focus-mode .workspace-grid{grid-template-columns:minmax(0,680px);justify-content:center}body.focus-mode .focus-panel{width:100%}body.dark-mode .focus-panel{background:linear-gradient(135deg,#0f315f 0%,#164a83 55%,#123761 100%);border-color:#69baff;box-shadow:0 14px 34px #020b1d80}body.dark-mode .focus-title{color:#ffe28c}body.dark-mode .focus-hint{color:#fff7d6}body.dark-mode .focus-zone{border-color:#78c6ff;background:#123c70}body.dark-mode .focus-card{background:#1c5791;border-color:#7cc8ff;border-left-color:#ffe28c;box-shadow:0 5px 14px #061d3d66}body.dark-mode .focus-card,.dark-mode .focus-card .task-meta{color:#fff}body.dark-mode .focus-task-title{color:#fff}.dark-mode .focus-index{color:#ffe28c}.dark-mode .focus-empty{color:#fff7d6}.dark-mode .focus-empty strong{color:#ffe28c}.dark-mode .focus-remove{background:#0e3767;color:#fff7d6}.dark-mode .focus-add{background:#0e3767;color:#fff7d6}@media(max-width:850px){body{padding:16px 12px}.header{grid-template-columns:1fr auto}.top-add-form{grid-column:1/-1;grid-template-columns:minmax(150px,1fr) 142px 106px auto}.workspace-grid{grid-template-columns:1fr}.focus-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.top-add-form{grid-template-columns:1fr 1fr}.top-add-form input:first-child{grid-column:1/-1}.top-add-form .add-btn{min-height:43px}.focus-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<div class="app-controls">
<button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="settingsMenu"><span class="menu-icon" aria-hidden="true">☰</span>選單</button>
<section class="settings-menu" id="settingsMenu" hidden aria-label="顯示與工作模式設定"><h2>顯示與工作模式</h2><p>依照現在的工作情境調整介面。</p>
<div class="setting-row"><label for="fontSize">字體大小</label><select id="fontSize"><option value="14">小</option><option value="16">標準</option><option value="18">大</option></select></div>
<div class="setting-row"><span>工作模式</span><div class="mode-options"><button class="mode-option" type="button" data-mode="edit">編輯</button><button class="mode-option" type="button" data-mode="focus">聚焦</button></div></div>
<div class="setting-row"><span>深色模式</span><label class="switch"><input id="darkMode" type="checkbox" aria-label="切換深色模式"><span class="switch-track"></span></label></div>
</section>
</div>
<header class="header"><h1>待辦事項</h1><p class="version">版本 v0.6</p><form class="add-form top-add-form" id="taskForm"><input id="taskInput" maxlength="120" placeholder="輸入工作事項…" aria-label="工作事項" required><input id="dueDate" type="date" aria-label="截止日期" title="截止日期"><select id="priority" aria-label="優先順序"><option value="medium">中優先</option><option value="high">高優先</option><option value="low">低優先</option></select><button class="add-btn" type="submit">新增工作</button></form></header>
<div class="focus-banner">🎯 聚焦模式已開啟：專心完成今天最重要的事項。</div>
<section class="stats">
<div class="stat"><div class="stat-label">全部工作</div><div class="stat-number" id="totalCount">0</div></div>
<div class="stat"><div class="stat-label">未完成（含進行中）</div><div class="stat-number purple" id="pendingCount">0</div></div>
<div class="stat"><div class="stat-label">已完成</div><div class="stat-number green" id="doneCount">0</div></div>
</section>
<div class="workspace-grid"><section class="panel focus-panel" aria-labelledby="focusHeading">
<div class="focus-head"><div><h2 id="focusHeading" class="focus-title">✨ 今日聚焦</h2><p class="focus-hint">選出今天最重要的事項，從下方待辦清單拖曳到這裡，或按「加入聚焦」。</p></div>
<div class="focus-controls"><label for="focusLimit">聚焦數量上限</label><select id="focusLimit" aria-label="今日聚焦數量上限"><option value="3">3 件</option><option value="4">4 件</option><option value="5">5 件</option></select><span class="focus-counter" id="focusCounter">0 / 3</span></div></div>
<div class="focus-zone" id="focusZone" aria-label="今日聚焦拖曳放置區"><div class="focus-list" id="focusList"></div></div>
</section>
<section class="panel task-panel">
<div class="toolbar"><h2>工作清單 <span id="listCount" style="font-size:13px;color:var(--muted);font-weight:500"></span></h2>
<div class="filters" role="tablist" aria-label="工作清單篩選">
<button class="tab active" role="tab" aria-selected="true" data-filter="pending">未完成</button>
<button class="tab" role="tab" aria-selected="false" data-filter="completed">已完成</button>
<button class="tab" role="tab" aria-selected="false" data-filter="all">全部</button>
</div></div>
<div class="sort-row"><label for="sortBy">排序方式</label><select id="sortBy">
<option value="priority">優先順序（高 → 中 → 低）</option>
<option value="dueAsc">截止日期（近 → 遠）</option>
<option value="createdDesc">建立日期（新 → 舊）</option>
<option value="createdAsc">建立日期（舊 → 新）</option>
</select></div>
<div class="task-list" id="taskList"></div>
</section>
</div><p class="footer">進度自動儲存在此瀏覽器的 Local Storage 中 · 不需登入</p>
</main>
<script>
(() => {
  const STORAGE_KEY = 'single-page-todo-v2';
  const priorityLabel = {high:'高', medium:'中', low:'低'};
  const priorityClass = {high:'priority-high', medium:'priority-medium', low:'priority-low'};
  const statusLabel = {notStarted:'未開始', inProgress:'進行中', completed:'已完成'};
  const priorityRank = {high:0, medium:1, low:2};
  let tasks = [];
  let currentFilter = 'pending';
  const FOCUS_KEY = 'single-page-todo-v04-focus';
  const SETTINGS_KEY = 'single-page-todo-v05-settings';
  let settings = {fontSize:16, mode:'edit', darkMode:false};
  try {
    const savedSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if (savedSettings && typeof savedSettings === 'object') {
      settings.fontSize = [14,16,18].includes(Number(savedSettings.fontSize)) ? Number(savedSettings.fontSize) : 16;
      settings.mode = savedSettings.mode === 'focus' ? 'focus' : 'edit';
      settings.darkMode = Boolean(savedSettings.darkMode);
    }
  } catch {}
  const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  let focus = {date:localDay(),limit:3,ids:[]};
  try {
    const savedFocus = JSON.parse(localStorage.getItem(FOCUS_KEY) || '{}');
    if (savedFocus && typeof savedFocus === 'object') {
      focus.limit = [3,4,5].includes(Number(savedFocus.limit)) ? Number(savedFocus.limit) : 3;
      if (savedFocus.date === localDay() && Array.isArray(savedFocus.ids)) focus.ids = [...new Set(savedFocus.ids.map(String))];
    }
  } catch {}
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    tasks = Array.isArray(stored) ? stored : [];
  } catch { tasks = []; }

  // 舊版資料相容：將 completed 布林值轉換為工作狀態，並補上時間欄位。
  tasks = tasks.map(t => {
    if (!t.status) t.status = t.completed ? 'completed' : 'notStarted';
    if (!['notStarted','inProgress','completed'].includes(t.status)) t.status = 'notStarted';
    if (!('completedAt' in t)) t.completedAt = null;
    if (!t.createdAt) t.createdAt = new Date().toISOString();
    if (!t.priority || !priorityRank.hasOwnProperty(t.priority)) t.priority = 'medium';
    return t;
  });

  const $ = id => document.getElementById(id);
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch { alert('顯示設定無法儲存，請檢查瀏覽器儲存空間。'); }
  }
  function applySettings() {
    document.documentElement.style.setProperty('--app-font-size', `${settings.fontSize}px`);
    document.body.classList.toggle('dark-mode', settings.darkMode);
    document.body.classList.toggle('focus-mode', settings.mode === 'focus');
    $('fontSize').value = String(settings.fontSize);
    $('darkMode').checked = settings.darkMode;
    document.querySelectorAll('.mode-option').forEach(button => {
      const active = button.dataset.mode === settings.mode;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
  }
  applySettings();
  $('today').textContent = new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());

  function pad(n){return String(n).padStart(2,'0');}
  function formatDateTime(value) {
    if (!value) return '';
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return '';
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function saveFocus() {
    try { localStorage.setItem(FOCUS_KEY,JSON.stringify(focus)); }
    catch { alert('今日聚焦設定無法儲存，請檢查瀏覽器儲存空間。'); }
  }
  function syncFocus() {
    if (focus.date !== localDay()) { focus.date=localDay(); focus.ids=[]; saveFocus(); }
    const valid = new Set(tasks.filter(t=>t.status!=='completed').map(t=>String(t.id)));
    const cleaned = focus.ids.filter(id=>valid.has(id)).slice(0,focus.limit);
    if (cleaned.length!==focus.ids.length) {focus.ids=cleaned;saveFocus();}
  }
  function addFocus(id) {
    syncFocus(); id=String(id);
    const task=tasks.find(t=>String(t.id)===id);
    if (!task || task.status==='completed') {alert('只有未完成的待辦事項可以加入今日聚焦。');return;}
    if (focus.ids.includes(id)) return;
    if (focus.ids.length>=focus.limit) {alert(`今日聚焦最多 ${focus.limit} 件，請先移除一件或調整上限。`);return;}
    focus.ids.push(id);saveFocus();render();
  }
  function removeFocus(id) {focus.ids=focus.ids.filter(x=>x!==String(id));saveFocus();render();}
  function renderFocus() {
    $('focusLimit').value=String(focus.limit);
    $('focusCounter').textContent=`${focus.ids.length} / ${focus.limit}`;
    const list=$('focusList');list.replaceChildren();
    if (!focus.ids.length) {
      const empty=document.createElement('div');empty.className='focus-empty';empty.style.gridColumn='1/-1';
      empty.innerHTML='<strong>🎯 今天最重要的事是什麼？</strong>從下方拖曳待辦事項到這裡，開始安排今日重點。';list.appendChild(empty);return;
    }
    focus.ids.forEach((id,index)=>{
      const task=tasks.find(t=>String(t.id)===id);if(!task)return;
      const card=document.createElement('article');card.className='focus-card'+(task.status==='completed'?' is-done':'');
      const head=document.createElement('div');head.className='focus-card-head';
      const rank=document.createElement('span');rank.className='focus-index';rank.textContent=`聚焦 ${index+1}`;
      const remove=document.createElement('button');remove.type='button';remove.className='focus-remove';remove.textContent='移出聚焦';remove.setAttribute('aria-label',`將${task.title}移出今日聚焦`);remove.addEventListener('click',()=>removeFocus(id));
      head.append(rank,remove);
      const title=document.createElement('div');title.className='focus-task-title';title.textContent=task.title;
      const meta=document.createElement('div');meta.className='task-meta';
      const priority=document.createElement('span');priority.className='tag '+priorityClass[task.priority];priority.textContent=`${priorityLabel[task.priority]}優先`;meta.appendChild(priority);
      if(task.dueDate){const due=document.createElement('span');due.className='tag';due.textContent=`截止：${task.dueDate.replaceAll('-','/')}`;meta.appendChild(due);}
      const state=document.createElement('span');state.className='tag status';state.textContent=statusLabel[task.status];meta.appendChild(state);
      card.append(head,title,meta);list.appendChild(card);
    });
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
    catch (e) { alert('無法儲存資料，請確認瀏覽器允許使用 Local Storage，且儲存空間足夠。'); }
    render();
  }
  function sortTasks(items) {
    const mode = $('sortBy').value;
    return [...items].sort((a,b) => {
      if (mode === 'priority') return priorityRank[a.priority]-priorityRank[b.priority] || new Date(b.createdAt)-new Date(a.createdAt);
      if (mode === 'dueAsc') {
        if (!a.dueDate && !b.dueDate) return new Date(b.createdAt)-new Date(a.createdAt);
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate) || new Date(b.createdAt)-new Date(a.createdAt);
      }
      if (mode === 'createdAsc') return new Date(a.createdAt)-new Date(b.createdAt);
      return new Date(b.createdAt)-new Date(a.createdAt);
    });
  }
  function render() {
    syncFocus();renderFocus();
    const done = tasks.filter(t => t.status === 'completed').length;
    $('totalCount').textContent = tasks.length;
    $('pendingCount').textContent = tasks.length - done;
    $('doneCount').textContent = done;
    let visible = tasks.filter(t => currentFilter === 'all' || (currentFilter === 'completed' ? t.status === 'completed' : t.status !== 'completed'));
    visible = sortTasks(visible);
    $('listCount').textContent = `（${visible.length} 項）`;
    const list = $('taskList');
    list.replaceChildren();
    if (!visible.length) {
      const empty = document.createElement('div'); empty.className = 'empty';
      empty.innerHTML = '<div style="font-size:30px;margin-bottom:8px">📝</div><div>目前沒有符合條件的工作</div><div style="font-size:13px;margin-top:5px">新增工作，開始追蹤你的進度吧！</div>';
      list.appendChild(empty); return;
    }
    visible.forEach(task => {
      const row = document.createElement('article');
      row.draggable = task.status !== 'completed';
      row.addEventListener('dragstart',e=>{
        if(task.status==='completed'){e.preventDefault();return;}
        e.dataTransfer.setData('text/plain',String(task.id));e.dataTransfer.effectAllowed='copy';row.classList.add('dragging');
      });
      row.addEventListener('dragend',()=>row.classList.remove('dragging'));
      row.className = 'task' + (task.status === 'completed' ? ' completed' : '');
      const check = document.createElement('input');
      check.type = 'checkbox'; check.className = 'check'; check.checked = task.status === 'completed';
      check.setAttribute('aria-label', '標記工作已完成');
      check.addEventListener('change', () => {
        if (check.checked) { task.status = 'completed'; task.completedAt = new Date().toISOString(); }
        else { task.status = 'notStarted'; task.completedAt = null; }
        save();
      });
      const main = document.createElement('div'); main.className = 'task-main';
      const title = document.createElement('div'); title.className = 'task-title'; title.textContent = task.title;
      const meta = document.createElement('div'); meta.className = 'task-meta';
      const p = document.createElement('span'); p.className = 'tag ' + priorityClass[task.priority]; p.textContent = `優先順序：${priorityLabel[task.priority]}`; meta.appendChild(p);
      const status = document.createElement('span'); status.className = 'tag status'; status.textContent = statusLabel[task.status]; meta.appendChild(status);
      if (task.dueDate) { const due = document.createElement('span'); due.className = 'tag'; due.textContent = `截止：${task.dueDate.replaceAll('-','/')}`; meta.appendChild(due); }
      const created = document.createElement('span'); created.className = 'tag'; created.textContent = `建立：${formatDateTime(task.createdAt)}`; meta.appendChild(created);
      if (task.status === 'completed' && task.completedAt) {
        const completedAt = document.createElement('span'); completedAt.className = 'done-time'; completedAt.textContent = `完成時間：${formatDateTime(task.completedAt)}`; meta.appendChild(completedAt);
      }
      main.append(title,meta);
      const actions = document.createElement('div'); actions.className = 'task-actions';
      const statusSelect = document.createElement('select');
      statusSelect.setAttribute('aria-label','工作狀態');
      [['notStarted','未開始'],['inProgress','進行中'],['completed','已完成']].forEach(([value,label]) => {
        const opt = document.createElement('option'); opt.value = value; opt.textContent = label; statusSelect.appendChild(opt);
      });
      statusSelect.value = task.status;
      statusSelect.addEventListener('change', () => {
        const next = statusSelect.value;
        if (next === 'completed' && task.status !== 'completed') task.completedAt = new Date().toISOString();
        else if (next !== 'completed') task.completedAt = null;
        task.status = next; save();
      });
      const edit = document.createElement('button'); edit.className = 'icon-btn'; edit.textContent = '編輯';
      edit.addEventListener('click', () => {
        const titleInput = prompt('修改工作事項：',task.title);
        if (titleInput === null) return;
        const clean = titleInput.trim();
        if (!clean) { alert('工作事項不可空白。'); return; }
        task.title = clean;
        const dueInput = prompt('截止日期（YYYY-MM-DD，留白代表不設定）：',task.dueDate || '');
        if (dueInput !== null) {
          const due = dueInput.trim();
          if (!due || /^\d{4}-\d{2}-\d{2}$/.test(due)) task.dueDate = due;
          else { alert('日期格式不正確，截止日期維持原設定。'); }
        }
        const priorityInput = prompt('優先順序請輸入：高、中、低',priorityLabel[task.priority]);
        if (priorityInput !== null) {
          const map = {'高':'high','中':'medium','低':'low','high':'high','medium':'medium','low':'low'};
          if (map[priorityInput.trim()]) task.priority = map[priorityInput.trim()];
          else alert('優先順序輸入無效，維持原設定。');
        }
        save();
      });
      const remove = document.createElement('button'); remove.className = 'icon-btn delete'; remove.textContent = '刪除';
      remove.addEventListener('click', () => {
        if (confirm(`確定要刪除「${task.title}」嗎？`)) { tasks = tasks.filter(t => t.id !== task.id); save(); }
      });
      const focusButton=document.createElement('button');focusButton.type='button';focusButton.className='icon-btn focus-add';
      const isFocused=focus.ids.includes(String(task.id));
      focusButton.textContent=isFocused?'✓ 已聚焦':'☆ 加入聚焦';focusButton.classList.toggle('active',isFocused);
      focusButton.disabled=task.status==='completed';
      focusButton.title=isFocused?'點擊移出今日聚焦':'加入今日聚焦';
      focusButton.addEventListener('click',()=>isFocused?removeFocus(task.id):addFocus(task.id));
      actions.append(focusButton,statusSelect,edit,remove);
      row.append(check,main,actions); list.appendChild(row);
    });
  }
  $('taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('taskInput').value.trim(); if (!title) return;
    tasks.push({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random(),
      title, dueDate:$('dueDate').value, priority:$('priority').value,
      status:'notStarted', completedAt:null, createdAt:new Date().toISOString()
    });
    $('taskInput').value=''; $('dueDate').value=''; $('priority').value='medium';
    save(); $('taskInput').focus();
  });
  document.querySelectorAll('.tab').forEach(button => button.addEventListener('click', () => {
    currentFilter = button.dataset.filter;
    document.querySelectorAll('.tab').forEach(b => { const active = b === button; b.classList.toggle('active',active); b.setAttribute('aria-selected',String(active)); });
    render();
  }));
  $('sortBy').addEventListener('change',render);
  $('menuButton').addEventListener('click', () => {
    const menu = $('settingsMenu');
    const willOpen = menu.hidden;
    menu.hidden = !willOpen;
    $('menuButton').setAttribute('aria-expanded', String(willOpen));
  });
  $('fontSize').addEventListener('change', event => {
    settings.fontSize = Number(event.target.value); saveSettings(); applySettings();
  });
  $('darkMode').addEventListener('change', event => {
    settings.darkMode = event.target.checked; saveSettings(); applySettings();
  });
  document.querySelectorAll('.mode-option').forEach(button => button.addEventListener('click', () => {
    settings.mode = button.dataset.mode; saveSettings(); applySettings();
  }));
  document.addEventListener('click', event => {
    const controls = document.querySelector('.app-controls');
    if (!controls.contains(event.target)) { $('settingsMenu').hidden = true; $('menuButton').setAttribute('aria-expanded', 'false'); }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { $('settingsMenu').hidden = true; $('menuButton').setAttribute('aria-expanded', 'false'); }
  });
  $('focusLimit').addEventListener('change',e=>{
    const next=Number(e.target.value);
    if(next<focus.ids.length){
      if(!confirm(`調整為 ${next} 件會移除最後 ${focus.ids.length-next} 件聚焦事項（原始待辦不會刪除），確定嗎？`)){
        e.target.value=String(focus.limit);return;
      }
      focus.ids=focus.ids.slice(0,next);
    }
    focus.limit=next;saveFocus();render();
  });
  const zone=$('focusZone');
  zone.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/plain')){e.preventDefault();e.dataTransfer.dropEffect='copy';zone.classList.add('drag-over');}});
  zone.addEventListener('dragleave',e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('drag-over');});
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');if(id)addFocus(id);});
  save();
})();
</script>
</body>
</html>
