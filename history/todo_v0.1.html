<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待辦事項管理</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #20263a; --muted: #7b8297;
    --primary: #6558d3; --primary-light: #eeecff; --border: #e7e9f2;
    --danger: #d84b5b; --success: #218a67;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 18px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    background: radial-gradient(circle at top left, #e9e7ff 0, transparent 34%), var(--bg);
    color: var(--text);
  }
  .app { width: min(900px, 100%); margin: 0 auto; }
  .header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; }
  .eyebrow { color:var(--primary); font-weight:700; font-size:13px; letter-spacing:1.5px; }
  h1 { margin:7px 0 6px; font-size:clamp(28px, 5vw, 38px); letter-spacing:-1px; }
  .subtitle { margin:0; color:var(--muted); }
  .date-pill { background:#fff; border:1px solid var(--border); padding:10px 14px; border-radius:14px; color:var(--muted); font-size:13px; white-space:nowrap; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px; }
  .stat { background:var(--card); padding:18px 20px; border:1px solid var(--border); border-radius:18px; box-shadow:0 8px 24px #252b4d08; }
  .stat-label { color:var(--muted); font-size:13px; }
  .stat-number { font-size:29px; font-weight:750; margin-top:5px; }
  .stat-number.purple { color:var(--primary); } .stat-number.green { color:var(--success); }
  .panel { background:var(--card); border:1px solid var(--border); border-radius:22px; padding:24px; box-shadow:0 12px 35px #252b4d0a; }
  .form-title { margin:0 0 15px; font-size:17px; }
  .add-form { display:grid; grid-template-columns:minmax(0,1fr) 145px 145px auto; gap:10px; }
  input, select, button { font:inherit; }
  input, select { min-width:0; border:1px solid var(--border); background:#fff; padding:12px 13px; border-radius:11px; color:var(--text); outline:none; }
  input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px #6558d31c; }
  button { border:0; border-radius:11px; cursor:pointer; font-weight:650; transition:transform .12s, opacity .12s; }
  button:active { transform:scale(.98); }
  .add-btn { padding:0 19px; background:var(--primary); color:#fff; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin:25px 0 14px; }
  .toolbar h2 { margin:0; font-size:19px; }
  .filters { display:flex; flex-wrap:wrap; gap:7px; }
  .filter { background:transparent; color:var(--muted); padding:8px 12px; border:1px solid transparent; font-size:13px; }
  .filter.active { color:var(--primary); background:var(--primary-light); border-color:#dfdcff; }
  .task-list { display:grid; gap:10px; }
  .task { display:flex; align-items:center; gap:13px; padding:15px 16px; border:1px solid var(--border); border-radius:15px; background:#fff; }
  .check { width:21px; height:21px; accent-color:var(--primary); cursor:pointer; flex-shrink:0; }
  .task-main { min-width:0; flex:1; }
  .task-title { font-weight:650; overflow-wrap:anywhere; }
  .task.completed .task-title { text-decoration:line-through; color:#9da2b1; }
  .task-meta { display:flex; flex-wrap:wrap; gap:7px; margin-top:6px; color:var(--muted); font-size:12px; }
  .tag { padding:3px 8px; border-radius:7px; background:#f1f2f7; }
  .priority-high { color:#b63d4a; background:#fff0f1; }
  .priority-medium { color:#a16a13; background:#fff6e4; }
  .priority-low { color:#28775d; background:#eaf8f1; }
  .task-actions { display:flex; gap:7px; }
  .icon-btn { padding:8px 10px; background:#f5f6fa; color:#656d82; font-size:13px; }
  .icon-btn.delete { color:var(--danger); background:#fff1f2; }
  .empty { padding:42px 16px; text-align:center; color:var(--muted); border:1px dashed #d9dcea; border-radius:15px; }
  .empty-icon { font-size:32px; margin-bottom:8px; }
  .footer { text-align:center; color:#9aa0b0; font-size:12px; margin:20px 0 0; }
  @media (max-width:700px) {
    body { padding:24px 12px; }
    .header { align-items:flex-start; } .date-pill { display:none; }
    .stats { gap:8px; } .stat { padding:14px 12px; } .stat-number { font-size:24px; }
    .panel { padding:17px; }
    .add-form { grid-template-columns:1fr 1fr; }
    .add-form input:first-child { grid-column:1 / -1; }
    .add-btn { min-height:44px; }
    .toolbar { align-items:flex-start; flex-direction:column; }
    .task { padding:13px 11px; gap:9px; }
    .task-actions { flex-direction:column; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div>
      <div class="eyebrow">MY DAILY PLANNER</div>
      <h1>待辦事項</h1>
      <p class="subtitle">把每件小事完成，讓今天更有方向。</p>
    </div>
    <div class="date-pill" id="today"></div>
  </header>

  <section class="stats" aria-label="任務統計">
    <div class="stat"><div class="stat-label">全部任務</div><div class="stat-number" id="totalCount">0</div></div>
    <div class="stat"><div class="stat-label">尚未完成</div><div class="stat-number purple" id="pendingCount">0</div></div>
    <div class="stat"><div class="stat-label">已完成</div><div class="stat-number green" id="doneCount">0</div></div>
  </section>

  <section class="panel">
    <h2 class="form-title">＋ 新增任務</h2>
    <form class="add-form" id="taskForm">
      <input id="taskInput" type="text" maxlength="120" placeholder="例如：完成專案企劃書…" aria-label="任務名稱" required>
      <input id="dueDate" type="date" aria-label="截止日期">
      <select id="priority" aria-label="任務優先順序">
        <option value="medium">中優先</option>
        <option value="high">高優先</option>
        <option value="low">低優先</option>
      </select>
      <button class="add-btn" type="submit">新增任務</button>
    </form>

    <div class="toolbar">
      <h2>我的清單 <span id="listCount" style="color:var(--muted);font-size:13px;font-weight:500"></span></h2>
      <div class="filters" role="group" aria-label="篩選任務">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="pending">未完成</button>
        <button class="filter" data-filter="completed">已完成</button>
      </div>
    </div>
    <div class="task-list" id="taskList"></div>
  </section>
  <p class="footer">資料會自動儲存在這個瀏覽器中 · 無需登入</p>
</main>

<script>
(() => {
  const STORAGE_KEY = 'single-page-todo-v1';
  const priorityText = { high: '高優先', medium: '中優先', low: '低優先' };
  const priorityClass = { high: 'priority-high', medium: 'priority-medium', low: 'priority-low' };
  let tasks = [];
  let currentFilter = 'all';

  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { tasks = []; }

  const $ = (id) => document.getElementById(id);
  $('today').textContent = new Intl.DateTimeFormat('zh-TW', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  }).format(new Date());

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    render();
  }

  function formatDueDate(date) {
    if (!date) return '';
    const d = new Date(date + 'T00:00:00');
    return '截止：' + new Intl.DateTimeFormat('zh-TW', {
      month: 'numeric', day: 'numeric'
    }).format(d);
  }

  function render() {
    const total = tasks.length;
    const done = tasks.filter(t => t.completed).length;
    $('totalCount').textContent = total;
    $('pendingCount').textContent = total - done;
    $('doneCount').textContent = done;

    const visible = tasks.filter(t =>
      currentFilter === 'all' ||
      (currentFilter === 'pending' && !t.completed) ||
      (currentFilter === 'completed' && t.completed)
    );
    $('listCount').textContent = `（${visible.length}）`;
    const list = $('taskList');
    list.replaceChildren();

    if (!visible.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<div class="empty-icon">📝</div><div>目前沒有符合條件的任務</div><div style="font-size:13px;margin-top:5px">新增一個任務，開始安排你的進度吧！</div>';
      list.appendChild(empty);
      return;
    }

    visible.forEach(task => {
      const row = document.createElement('article');
      row.className = 'task' + (task.completed ? ' completed' : '');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'check';
      checkbox.checked = task.completed;
      checkbox.setAttribute('aria-label', '標記完成');
      checkbox.addEventListener('change', () => {
        task.completed = checkbox.checked;
        save();
      });

      const main = document.createElement('div');
      main.className = 'task-main';
      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = task.title;

      const meta = document.createElement('div');
      meta.className = 'task-meta';
      const priority = document.createElement('span');
      priority.className = 'tag ' + priorityClass[task.priority];
      priority.textContent = priorityText[task.priority];
      meta.appendChild(priority);
      if (task.dueDate) {
        const due = document.createElement('span');
        due.className = 'tag';
        due.textContent = formatDueDate(task.dueDate);
        meta.appendChild(due);
      }
      main.append(title, meta);

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      const edit = document.createElement('button');
      edit.className = 'icon-btn';
      edit.textContent = '編輯';
      edit.addEventListener('click', () => {
        const updated = prompt('修改任務名稱：', task.title);
        if (updated === null) return;
        const clean = updated.trim();
        if (!clean) { alert('任務名稱不可為空白。'); return; }
        task.title = clean;
        save();
      });

      const remove = document.createElement('button');
      remove.className = 'icon-btn delete';
      remove.textContent = '刪除';
      remove.addEventListener('click', () => {
        if (confirm(`確定要刪除「${task.title}」嗎？`)) {
          tasks = tasks.filter(t => t.id !== task.id);
          save();
        }
      });
      actions.append(edit, remove);
      row.append(checkbox, main, actions);
      list.appendChild(row);
    });
  }

  $('taskForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const title = $('taskInput').value.trim();
    if (!title) return;
    tasks.unshift({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
      title,
      dueDate: $('dueDate').value,
      priority: $('priority').value,
      completed: false,
      createdAt: new Date().toISOString()
    });
    $('taskInput').value = '';
    $('dueDate').value = '';
    $('priority').value = 'medium';
    save();
    $('taskInput').focus();
  });

  document.querySelectorAll('.filter').forEach(button => {
    button.addEventListener('click', () => {
      currentFilter = button.dataset.filter;
      document.querySelectorAll('.filter').forEach(b => b.classList.toggle('active', b === button));
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
